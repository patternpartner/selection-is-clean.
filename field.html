<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Selection Pe — field</title>
<!--
  MORE THAN ONE UNIVERSE PER WINDOW.

  MEASURED, headless Chromium, 40s per row (a phone is slower in absolute terms; the SHAPE holds):

     universes   ticks/sec each   ticks/sec total   peers   migrants/40s   heap
         1           54.1              54.1           0          0         21 MB
         2           37.2              74.4           1          9         39 MB
         4           19.0              75.8           3         32         35 MB
         6           15.2              91.3           5         60         73 MB

  Read that as a trade, not a cost. Total simulated time goes UP (54 -> 91), so the thread is being
  used better rather than divided. What falls is each creature's own clock — at six, 28% of solo
  speed. What rises, quadratically, is trading: migrants track the number of PAIRS (1, 6, 15 -> 9,
  32, 60). The scheduler is fair: slowest and fastest frame were within 1% at every N.
  So the ceiling is not in this file. It is whichever arrives first — the main thread (throughput
  saturates around 75-91/sec, past which more frames mostly just slow each other), memory, or your
  patience watching something tick fifteen times a second.

  engine.html is a single global-scoped script — `const genome`, `let N` — so two copies cannot share
  one document. Iframes are the only way, and that is all this page is: a grid of them. The engine is
  not modified and does not know it is in a frame.

  WHY IT IS WORTH DOING. Peering already worked between two tabs, but only the VISIBLE tab runs at
  speed: the engine falls back to setTimeout(loop,67) when document.hidden, and browsers clamp
  background timers to about once a second. So two tabs meant one universe at ~50 ticks/sec and one
  at ~1. Side by side in one visible document, every frame gets requestAnimationFrame.
  Measured, two frames over HTTP for 40s: 1,273 and 1,271 ticks — symmetric — and
  network.migrantAccepted fired 3 and 4 times. That counter reads NEVER in every single-process
  census in this repo, because a lone universe has no peers.

  They find each other over BroadcastChannel('selection-pe-network'), which is same-origin, so a
  window running this page and a second window running it too are all on one network. Two windows in
  split screen, two universes each, is four lineages trading — and on a phone in split screen both
  windows are visible, so none of them is throttled.

    field.html            two universes
    field.html#n=4        four
    field.html#n=2,clean  pass 'cleanart' through to each frame (no HUD, just the artwork)

  KNOWN, AND DELIBERATELY NOT SOLVED HERE: every universe autosaves to the same fixed
  localStorage key, so they overwrite each other's stored lineage. The live trading is unaffected —
  that is BroadcastChannel, not storage — but only one lineage survives a reload. Fixing it means
  changing the engine's save key, which is a separate decision.
-->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #grid{display:grid;height:100%;width:100%;
        grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
        gap:1px;background:#1a1a1c}
  iframe{border:0;width:100%;height:100%;display:block;background:#000;min-height:0;min-width:0}
</style>
<div id="grid"></div>
<script>
(function(){
  var hash=(location.hash||'').replace(/^#/,'');
  var m=hash.match(/(?:^|,)n=(\d+)/);
  var n=m?parseInt(m[1],10):2;
  if(!(n>=1))n=2;
  if(n>8)n=8;                                   // not a hard limit — see the measurements above.
                                                // Throughput saturates around six; eight is where
                                                // a phone's memory becomes the argument.
  var clean=/(^|,)(clean|cleanart)(,|$)/.test(hash);
  var frag=document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var f=document.createElement('iframe');
    // Each frame gets its own src so the browser treats them as independent documents.
    // The cache-buster is only to stop a frame being reused; the engine seeds its own randomness.
    f.src='engine.html'+(clean?'#cleanart':'');
    f.title='Universe '+(i+1);
    f.setAttribute('allow','autoplay');
    frag.appendChild(f);
  }
  document.getElementById('grid').appendChild(frag);
  // A hash change is a different field: rebuild rather than leave stale frames running.
  addEventListener('hashchange',function(){ location.reload(); });
})();
</script>
