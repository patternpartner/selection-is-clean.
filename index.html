<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Selection</title>
<!--
  THE FIELD — eight universes trading, and a ninth that is made of all of them.

  WHAT MOVED. This file used to be the single worker shell; that is now universe.html, unchanged.
  This is a grid of iframes of it. engine.html is untouched and still runs one universe on the main
  thread for any device without OffscreenCanvas.

  WHY IFRAMES. engine.html is one global-scoped script (const genome, let N), so two copies cannot
  share a document. The engine is not modified and does not know it is framed.

  WHY THE WORKER SHELL AND NOT engine.html DIRECTLY. universe.html runs the simulation in a Web
  Worker on an OffscreenCanvas, so each universe gets its OWN THREAD instead of sharing the page's.
  Measured, same reader, 4-core machine, 40s:

      4 x universe.html (worker)      30 ticks/sec each     120 total
      4 x engine.html   (main thread) 15 ticks/sec each      60 total
      8 x universe.html (worker)      15 ticks/sec each     120 total

  Twice the speed per universe, and it scales with CORES — it saturates at 8 above only because that
  box has 4. A phone with 8 cores should hold four near full speed.

  HOW MANY. Measured at a 412x915 phone viewport, worker mode, 45s each, on a FOUR-CORE machine:

      universes   ticks/sec each   ticks/sec total   panel sees   heap
          4           40.1             160.3             4         6 MB
          6           26.7             160.3             6         7 MB
          8           20.0             160.0             7  <--     8 MB

  Total throughput is PINNED at 160/sec regardless of N, so past four you are not buying simulated
  time — you are buying PEERS with each universe's clock. That is the trade this page exists to make:
  a collapsed universe needs foreign genomes far more than it needs its own ticks.
  THE DEFAULT IS EIGHT INDIVIDUALS plus the collective, chosen deliberately, because the target device
  has EIGHT cores and worker mode scales with cores. The check costs nothing: tap any universe and
  read the metabolism panel. "9 univs" means the field is fully connected; fewer means drop to /#n=6.

  ═══ #153 — THE COLLECTIVE UNIVERSE ═══════════════════════════════════════════════════════════════
  #152 gave the field one save button that wrote all N genomes into one file. It worked, and it was
  the wrong shape: a file is a thing you have to remember to press, and the moment you load one back
  you have decided from the outside which universe gets which lineage. The collective was a FILE
  FORMAT, not a thing that lives.

  So the last cell is a universe. Not a summary of the others, not a merge of their genomes — a real
  ninth world running the same engine, whose input is the other eight. Every second the field takes
  ONE EMIGRANT out of each individual and hands it to the collective; four times slower, it takes one
  out of the collective and hands it back to one individual, round-robin. Eight in, one out: the
  collective is a sink eight times over, which is what makes it a mixing vessel rather than a ninth
  peer.

  WHY THIS DOES NOT HOMOGENISE. The unit of exchange is a MIGRANT — one particle, with its program
  and its vocabulary — not a genome. Nothing is overwritten. An individual that receives a collective
  emigrant has gained one immigrant among a few hundred residents, and its own selection decides
  within a few thousand ticks whether that lineage leaves descendants. The eight stay eight. What
  the collective accumulates is what SURVIVED being sent from eight different worlds.
  (The #152 field save did the opposite: it wrote whole genomes over whole genomes. That is the
  homogenising move, and it is gone.)

  WHY THE PACKETS ARE REAL. pull() calls the engine's own buildMigrantPacket() and stamps the
  engine's own netPacket() envelope — the identical object networkBroadcast would have put on the
  wire, with the source universe's real TAB_ID. feed() puts it through the recipient's own
  handleNetworkMessage(). validNetworkPayload, the queue caps, the peer bookkeeping and the
  tab===TAB_ID self-drop all still apply. The relay cannot inject anything a peer could not have
  sent, because a peer built it. All the field changes is WHO HEARS IT.

  SAVING. The collective's own 💾 button saves the collective, which is the point: one file, one
  lineage, the distilled thing. It also autosaves to its own localStorage slot (selection_collective)
  every 60 seconds and comes back into the collective — and only the collective — on reload, so the
  eight individuals keep sharing the engine's single slot exactly as they always have and the
  collective's lineage can never be overwritten by whichever individual wrote last.

      /                 eight universes and the collective
      /#n=2             two and the collective
      /#n=4             four and the collective
      /#n=6             six and the collective
      /#solo            no collective, no relay — just the individuals
      /#n=4,hud         put the HUD back on every frame (a field is clean by default)
      /#pool=2          pack the universes onto exactly two workers (default: one per core, max 4)
      /#nopool          one worker per universe, the pre-#162 layout — for comparison, and costs more
      /#bgpace=400      how hard to slow the OTHER universes while one is open (default 200ms, 0 = off)

  TAP a universe to open it full size, with its instruments AND its save/load buttons on; tap 'field'
  (or Escape) to go back. Nothing reloads either way — the others keep running and trading while you
  look. In the grid a cell is a tab and nothing else: the buttons are not rendered there at all,
  because the tap target sits over them and opening the universe is the only thing a tap in the grid
  can mean. Eighteen buttons that could be seen and not pressed read as broken, and were.
      /#<genome>        ONE universe loaded from that lineage — old saved links keep working
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  #grid{display:grid;height:100%;width:100%;gap:1px;background:#191a1c}
  .cell{position:relative;min-width:0;min-height:0}
  iframe{border:0;width:100%;height:100%;display:block;background:#000}
  /* The tap target sits OVER the frame so one tap always lands on the field rather than on whatever
     the engine has drawn there. #153: it is HIDDEN while a universe is open. It used not to be —
     open() only toggled classes — so the overlay went on covering the opened cell and quietly ate
     every tap meant for that universe's own save and load buttons. They were visible and dead. */
  .tap{position:absolute;inset:0;background:transparent;cursor:pointer}
  #grid.open .cell.on .tap{display:none}
  /* Open: this cell covers the whole grid. Nothing is reloaded — the others keep running underneath. */
  #grid.open .cell{display:none}
  #grid.open .cell.on{display:block;grid-column:1/-1;grid-row:1/-1}
  .cell.collective{outline:1px solid #2f6;outline-offset:-1px}
  /* #157: a universe that is catching exceptions is dim, not obviously broken. Say it out loud. */
  .cell.erroring{outline:2px solid #e44;outline-offset:-2px}
  .errbadge{position:absolute;left:3px;bottom:3px;z-index:3;pointer-events:none;
        font:9px/1.2 ui-monospace,Menlo,monospace;color:#fbb;background:rgba(60,0,0,.82);
        border-radius:4px;padding:3px 5px;max-width:94%}
  .cell.collective .badge{position:absolute;left:3px;top:3px;z-index:2;pointer-events:none;
        font:9px/1 ui-monospace,Menlo,monospace;color:#8fb;background:rgba(0,20,12,.7);
        border-radius:4px;padding:3px 5px;letter-spacing:.5px}
  #grid.open .cell.collective .badge{font-size:11px;left:8px;top:8px}
  #back{position:fixed;left:8px;top:8px;z-index:9;display:none;
        font:12px/1 ui-monospace,Menlo,monospace;color:#cfe;background:rgba(10,14,16,.82);
        border:1px solid #2a4a44;border-radius:7px;padding:8px 11px}
  #grid.open ~ #back{display:block}
  /* The collective says what it is taking in, on itself. This used to be a fixed panel at the
     bottom-left of the PAGE, where it sat on top of the last cell's own save button. */
  #fmsg{display:none}
</style>
<div id="grid"></div>
<div id="back">&#8592; field</div>
<div id="fmsg"></div>
<script>
(function(){
  'use strict';
  var raw=(location.hash||'').replace(/^#/,'');
  // A saved lineage is a long opaque blob. Anything that is not one of our own options is treated as
  // a genome and gets a single universe, so every link anyone has ever saved still opens its world.
  // ═══ #160 — THE FIELD NEEDS A WAY OUT ═══════════════════════════════════════════════════════
  // Reported: a heavy genome loaded into the field made the phone kill the tab, and because every
  // universe boots from the same stored lineage, EVERY RELOAD LOADED IT AGAIN AND DIED AGAIN. There
  // was no escape from inside the artwork. `universe.html#reset` clears the shared key, but not the
  // collective's own slot, so the collective dragged the same creature back on the next boot — and
  // `index.html#reset` did not work at all: "reset" was not in the options list below, so the field
  // treated it as a GENOME and tried to decode the word.
  // /#reset now clears BOTH keys and starts a clean field. It is the one thing the artwork must
  // always be able to do: let go of what it is holding.
  var OPT = '(n=\\d+|pool=\\d+|nopool|bgpace=\\d+|clean|cleanart|hud|solo|reset)';
  var isOptions = raw==='' || new RegExp('^'+OPT+'(,'+OPT+')*$').test(raw);
  if(isOptions && /(^|,)reset(,|$)/.test(raw)){
    try{ localStorage.removeItem('selection_genome'); }catch(e){}
    try{ localStorage.removeItem('selection_collective'); }catch(e){}
    // Strip it so the NEXT reload does not wipe the fresh field too — the same one-shot rule
    // universe.html already applies to its own #reset.
    try{ history.replaceState(null,'',location.pathname||' '); }catch(e){}
    raw=raw.replace(/(^|,)reset(?=,|$)/,'').replace(/^,/,'');
  }
  var n, clean=false, passHash='', wantCollective=false;
  if(isOptions){
    var m=raw.match(/n=(\d+)/);
    n = m ? parseInt(m[1],10) : 8;                 // eight INDIVIDUALS, by the author's call
    if(!(n>=1)) n=4;
    if(n>8) n=8;                                   // not a hard limit; past the core count the
                                                   // universes only slow each other down
    wantCollective = n>1 && !/(^|,)solo(,|$)/.test(raw);
    // CLEAN BY DEFAULT WHEN THERE IS MORE THAN ONE. #144 measured the HUD at 2,788 characters over
    // half a full phone screen; in a quarter-screen frame it is roughly twice the frame. Rendered
    // four-up it buries the artwork entirely, and four metabolism panels is four of everything.
    // So a field is clean unless asked otherwise; a single universe is untouched.
    clean = /clean/.test(raw) || (n>1 && !/(^|,)hud(,|$)/.test(raw));
  } else {
    n=1; passHash='#'+raw;                         // a lineage, opened by itself
  }
  var total=n+(wantCollective?1:0);

  // ═══ #162 — HOW MANY WORKERS ═══════════════════════════════════════════════════════════════
  // The field has TWO ceilings and they pull in opposite directions. Memory is per-ISOLATE: nine
  // universes on nine workers cost 1,309 MB, the same nine on three cost 815 MB, because what
  // grows is V8 heap slack rather than anything the simulation owns. Throughput is per-CORE: total
  // ticks across the whole field are flat from about four workers onward no matter how many
  // universes run, and packing all nine onto ONE worker halved them.
  //
  // So the rule is the point where those two curves cross: never more isolates than cores, never
  // more isolates than universes. That removes the oversubscription that was costing memory AND
  // throughput at the same time, and it can never make a small field worse — three universes still
  // get three workers, exactly as before. The cap of 4 is the measured plateau; a phone reports 8
  // hardware threads but four of them are little cores.
  // A SharedWorker outlives the DOCUMENT that created it — it dies only when its last port closes.
  // On a reload the new page's iframes can connect before the old page's ports have finished
  // disentangling, and then the new field joins a worker that is still running the OLD page's
  // universes: nine zombie loops that nothing can see, reach or stop, one more set per refresh.
  // So the pool name carries a nonce minted once per page load. Every cell in THIS load shares it
  // and pools together; a reload mints a new one, gets clean workers, and the old worker's last
  // port closes with nobody left to keep it alive, so the browser reaps it and its universes.
  // ═══ #164 — LOOKING AT A UNIVERSE WAKES IT UP ═══════════════════════════════════════════════
  // The field's tick budget is FIXED — four workers buy about five times one universe and that is
  // the whole phone — so the only lever past a handful of universes is who gets the ticks.
  //
  // The trap is that slowing everything down is not allocation, it is just loss: a field where every
  // cell is paced runs slower and nobody is better off. Pace only pays when the budget it frees goes
  // somewhere. So nothing is paced while you are looking at the whole field — that is today's
  // behaviour exactly — and the moment you open ONE universe, the other eight stand down and hand
  // their ticks to it. Tapping a cell stops meaning "make this bigger" and starts meaning "wake this
  // up", which is what the instruments were always for.
  //
  // 200ms is five ticks a second for a universe nobody is looking at, against roughly twenty-three
  // in a full field. #bgpace=0 turns the whole thing off and every cell runs flat out always.
  //
  // Worth knowing, because it is a real consequence and not a side effect: #163 makes a paced
  // universe ISOLATED as well as slow — it accepts migrants in proportion to its own clock, so the
  // eight that stand down also stop taking much in while you look at the ninth. Over the seconds or
  // minutes of actually looking at something that is nothing; it would matter if a cell were left
  // open for hours, and that is the case to watch.
  var BGPACE = (function(){ var m=raw.match(/bgpace=(\d+)/); var v=m?parseInt(m[1],10):200;
                            return Math.max(0,Math.min(5000,isFinite(v)?v:200)); })();
  var POOL_RUN = Math.random().toString(36).slice(2,10);
  var pool;
  var pm = raw.match(/pool=(\d+)/);
  if (/(^|,)nopool(,|$)/.test(raw)) pool = total;                    // the pre-#162 layout, for comparison
  else if (pm) pool = Math.max(1, Math.min(total, parseInt(pm[1],10)||1));
  else pool = Math.max(1, Math.min(total, Math.min(4, (navigator.hardwareConcurrency||4))));

  var cols=Math.ceil(Math.sqrt(total));
  var grid=document.getElementById('grid');
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  var frag=document.createDocumentFragment(), cells=[], collectiveCell=null;
  for(var i=0;i<total;i++){
    var isColl = wantCollective && i===total-1;
    var cell=document.createElement('div'); cell.className='cell'+(isColl?' collective':'');
    var f=document.createElement('iframe');
    // Cells sharing a slot share one SharedWorker, one connection and one universe each. The slot
    // rides in the QUERY string, not the hash: the hash is forwarded verbatim into the engine and
    // every flag it carries is the creature's, not the field's.
    f.src='universe.html?pool='+POOL_RUN+'x'+(i%pool)+(passHash||(clean?'#cleanart':''));
    f.title=isColl?'The collective':('Universe '+(i+1));
    f.setAttribute('allow','autoplay');
    cell.appendChild(f);
    if(isColl){ var b=document.createElement('div'); b.className='badge'; b.textContent='collective'; cell.appendChild(b); }
    if(total>1){ var t=document.createElement('div'); t.className='tap'; cell.appendChild(t); }
    frag.appendChild(cell); cells.push(cell);
    if(isColl) collectiveCell=cell;
  }
  grid.appendChild(frag);
  var individuals=cells.slice(0, wantCollective?cells.length-1:cells.length);

  // #150 — TAP A UNIVERSE TO LOOK INSIDE IT.
  // A field is clean because eight HUDs at ninth-size are unreadable (#144 measured the HUD at half
  // a FULL phone screen). But clean should not mean unavailable: the instruments are the point of the
  // thing. Tapping opens one universe to full size AND turns its own readouts back on by clearing its
  // hash — which the metabolism panel (main thread) and the HUD (inside the worker, via the #150
  // forward) both honour live. NOTHING RELOADS: the others keep running and keep trading, and the
  // opened one keeps the lineage it has been growing. A reload would drop it back to the shared
  // localStorage slot, which by then holds some other universe's genome.
  var openCell=null;
  function setFrameHash(cell,h){
    var w=cell.firstChild.contentWindow;
    try{ if((w.location.hash||'')!==h) w.location.hash=h; }catch(e){}
  }
  // #154: the controls come WITH the universe. In the grid a cell is a tab and nothing else — the
  // save/load buttons are not rendered there, because the tap target sits over them and opening the
  // universe is the only thing a tap in the grid can mean. Open it and it gets its buttons.
  function controls(cell,show){ var a=api(cell); if(a&&a.controls) a.controls(show); }
  // #164: hand the field's ticks to whichever universe is being looked at — but only the ticks it
  // can actually use.
  //
  // The first version of this stood ALL eight others down, and measured: the open cell went from
  // 16.2 to 52.8 ticks/second while the field's total fell from 189 to 90. It gained 36 and the
  // others gave up 136. That is not allocation, it is mostly waste — one universe runs on ONE
  // worker, so it cannot absorb four workers' worth however much they stand aside.
  //
  // Only a universe SHARING THE OPEN ONE'S WORKER is competing with it for anything (#162: cells
  // are packed onto a pool of SharedWorkers, and a worker is one thread). So stand down that
  // worker's other cells and leave the rest of the field running at full speed. The open universe
  // still gets its thread to itself; the six or seven universes on other workers never notice.
  function slotOf(cell){ var i=cells.indexOf(cell); return i<0?-1:(i%pool); }
  function allocate(focus){
    if(!BGPACE)return;
    var slot = focus ? slotOf(focus) : -1;
    for(var i=0;i<cells.length;i++){
      var a=api(cells[i]); if(!a||!a.pace)continue;
      var standDown = !!focus && cells[i]!==focus && (i%pool)===slot;
      try{ a.pace(standDown ? BGPACE : 0); }catch(e){}
    }
  }
  function open(cell){
    openCell=cell;
    for(var i=0;i<cells.length;i++) cells[i].classList.toggle('on',cells[i]===cell);
    grid.classList.add('open');
    setFrameHash(cell,'');                      // instruments on
    controls(cell,true);
    allocate(cell);                             // the other eight stand down
  }
  function close(){
    if(!openCell)return;
    controls(openCell,false);
    setFrameHash(openCell, clean?'#cleanart':'');   // back to however the field is configured
    grid.classList.remove('open');
    for(var i=0;i<cells.length;i++) cells[i].classList.remove('on');
    openCell=null;
    allocate(null);                             // everybody back to full
  }
  grid.addEventListener('click',function(e){
    if(openCell)return;                          // inside an open universe, its own controls win
    var t=e.target;
    if(!t||t.className!=='tap')return;
    open(t.parentNode);
  });
  document.getElementById('back').addEventListener('click',function(e){ e.stopPropagation(); close(); });
  addEventListener('keydown',function(e){ if(e.key==='Escape')close(); });

  // ═══ #153 — THE COLLECTIVE ══════════════════════════════════════════════════════════════════
  var msgEl=document.getElementById('fmsg');
  // Write the field's readout into the COLLECTIVE'S OWN BADGE rather than a panel floating over
  // whichever cell happens to be bottom-left. It reads as a label on the thing it describes, and it
  // grows with the cell when you open it.
  var badgeEl=null;
  function msg(t){
    if(!badgeEl && collectiveCell) badgeEl=collectiveCell.querySelector('.badge');
    if(badgeEl) badgeEl.textContent = t ? ('collective '+t) : 'collective';
    if(msgEl) msgEl.textContent=t||'';
  }
  function api(cell){ try{ return cell.firstChild.contentWindow.__field||null; }catch(e){ return null; } }

  if(!wantCollective){ if(msgEl) msgEl.style.display='none'; return; }

  // ═══ #157 — A UNIVERSE THAT IS QUIETLY FAILING MUST SAY SO ══════════════════════════════════
  // The field runs every universe with #cleanart, which hides the HUD — and the HUD was the ONLY
  // place a caught tick was reported. So a universe could throw on every tick, keep counting, stop
  // saving, and look merely dim. That is exactly what happened: 300,000 ticks, blank frames, and a
  // reload that came back at 198,000. Nothing about the field showed it.
  // Every 10 seconds each universe is asked for its caught-tick count, and any that is above zero
  // gets a red outline and a label. Cheap, and it turns a silent failure into a visible one without
  // switching the instruments back on.
  var errBadges={};
  function checkErrors(){
    cells.forEach(function(c,i){
      var a=api(c); if(!a||!a.stat) return;
      a.stat().then(function(s){
        if(!s) return;
        var n=s.errs|0;
        if(n>0){
          c.classList.add('erroring');
          var b=errBadges[i];
          if(!b){ b=document.createElement('div'); b.className='errbadge'; c.appendChild(b); errBadges[i]=b; }
          b.textContent='\u26a0 '+n+' caught'+(s.errMsg?(': '+String(s.errMsg).slice(0,60)):'');
        } else if(c.classList.contains('erroring')){
          c.classList.remove('erroring');
          if(errBadges[i]){ errBadges[i].remove(); delete errBadges[i]; }
        }
      }).catch(function(){});
    });
  }
  setInterval(checkErrors, 10000);
  setTimeout(checkErrors, 4000);

  var COLLECT_MS=1000;      // one emigrant out of each individual, per cycle
  var RETURN_EVERY=4;       // ...and one out of the collective every 4th cycle, to ONE individual
  var COLL_KEY='selection_collective';
  var cycles=0, inCount=0, outCount=0, returnTo=0;

  // Eight in, one out. A pull that comes back null is a cycle where that world sent nothing — either
  // it had no eligible particle, or (#158) its own evolved netMigrantRate said not to speak. Both are
  // the same answer networkBroadcast would have given, which is the point: the relay decides who
  // HEARS a migrant, never whether one is made. A universe that evolves its way to silence goes
  // silent here too.
  function relay(){
    var coll=api(collectiveCell); if(!coll) return;
    cycles++;
    for(var i=0;i<individuals.length;i++){
      var a=api(individuals[i]); if(!a) continue;
      a.pull().then(function(p){ if(p){ coll.feed(p); inCount++; } }).catch(function(){});
    }
    if(cycles%RETURN_EVERY===0 && individuals.length){
      var target=api(individuals[returnTo%individuals.length]); returnTo++;
      if(target) coll.pull().then(function(p){ if(p){ target.feed(p); outCount++; } }).catch(function(){});
    }
    if(cycles%5===0) msg('\u2190'+inCount+' \u2192'+outCount);
  }

  // THE COLLECTIVE'S OWN SLOT. The engine autosaves every universe into one shared localStorage key
  // and reads it back on boot, so on a reload the collective would come up as a copy of whichever
  // individual wrote last — the distilled lineage overwritten by an arbitrary one. This is a second
  // slot that only the collective writes and only the collective reads.
  function collectiveAutosave(){
    var coll=api(collectiveCell); if(!coll) return;
    coll.save().then(function(data){
      if(!data) return;
      try{ localStorage.setItem(COLL_KEY,data); }
      catch(e){ msg('\u2014 storage full'); }
    }).catch(function(){});
  }
  // Nothing in here may be one-shot. The whole collective — the relay, the autosave, the restore —
  // hangs off this call, and a phone that had not finished loading the ninth iframe by the time it
  // ran would have got a field with a ninth universe in it that was not fed by anything, silently
  // and for the rest of the session. So it waits for the frame instead of asking once.
  var startTries=0;
  function restoreCollective(){
    var stored=null; try{ stored=localStorage.getItem(COLL_KEY); }catch(_){}
    var coll=api(collectiveCell);
    if(!coll){ if(++startTries<100) setTimeout(restoreCollective,300); return; }
    coll.ready().then(function(){
      if(stored&&stored.length>20) return coll.load(stored);
      return false;
    }).then(function(){
      setInterval(relay, COLLECT_MS);
      // The first write comes early. A phone tab that is opened, looked at, and closed inside a
      // minute would otherwise store nothing at all, and the whole point of the collective is that
      // it is the thing that accumulates.
      setTimeout(collectiveAutosave, 20000);
      setInterval(collectiveAutosave, 60000);
    }).catch(function(){ setInterval(relay, COLLECT_MS); });
  }
  setTimeout(restoreCollective, 1200);
})();
</script>
