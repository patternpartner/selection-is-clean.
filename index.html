<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Selection</title>
<!--
  THE FIELD — eight universes trading, and a ninth that is made of all of them.

  WHAT MOVED. This file used to be the single worker shell; that is now universe.html, unchanged.
  This is a grid of iframes of it. engine.html is untouched and still runs one universe on the main
  thread for any device without OffscreenCanvas.

  WHY IFRAMES. engine.html is one global-scoped script (const genome, let N), so two copies cannot
  share a document. The engine is not modified and does not know it is framed.

  WHY THE WORKER SHELL AND NOT engine.html DIRECTLY. universe.html runs the simulation in a Web
  Worker on an OffscreenCanvas, so each universe gets its OWN THREAD instead of sharing the page's.
  Measured, same reader, 4-core machine, 40s:

      4 x universe.html (worker)      30 ticks/sec each     120 total
      4 x engine.html   (main thread) 15 ticks/sec each      60 total
      8 x universe.html (worker)      15 ticks/sec each     120 total

  Twice the speed per universe, and it scales with CORES — it saturates at 8 above only because that
  box has 4. A phone with 8 cores should hold four near full speed.

  HOW MANY. Measured at a 412x915 phone viewport, worker mode, 45s each, on a FOUR-CORE machine:

      universes   ticks/sec each   ticks/sec total   panel sees   heap
          4           40.1             160.3             4         6 MB
          6           26.7             160.3             6         7 MB
          8           20.0             160.0             7  <--     8 MB

  Total throughput is PINNED at 160/sec regardless of N, so past four you are not buying simulated
  time — you are buying PEERS with each universe's clock. That is the trade this page exists to make:
  a collapsed universe needs foreign genomes far more than it needs its own ticks.
  THE DEFAULT IS EIGHT INDIVIDUALS plus the collective, chosen deliberately, because the target device
  has EIGHT cores and worker mode scales with cores. The check costs nothing: tap any universe and
  read the metabolism panel. "9 univs" means the field is fully connected; fewer means drop to /#n=6.

  ═══ #153 — THE COLLECTIVE UNIVERSE ═══════════════════════════════════════════════════════════════
  #152 gave the field one save button that wrote all N genomes into one file. It worked, and it was
  the wrong shape: a file is a thing you have to remember to press, and the moment you load one back
  you have decided from the outside which universe gets which lineage. The collective was a FILE
  FORMAT, not a thing that lives.

  So the last cell is a universe. Not a summary of the others, not a merge of their genomes — a real
  ninth world running the same engine, whose input is the other eight. Every second the field takes
  ONE EMIGRANT out of each individual and hands it to the collective; four times slower, it takes one
  out of the collective and hands it back to one individual, round-robin. Eight in, one out: the
  collective is a sink eight times over, which is what makes it a mixing vessel rather than a ninth
  peer.

  WHY THIS DOES NOT HOMOGENISE. The unit of exchange is a MIGRANT — one particle, with its program
  and its vocabulary — not a genome. Nothing is overwritten. An individual that receives a collective
  emigrant has gained one immigrant among a few hundred residents, and its own selection decides
  within a few thousand ticks whether that lineage leaves descendants. The eight stay eight. What
  the collective accumulates is what SURVIVED being sent from eight different worlds.
  (The #152 field save did the opposite: it wrote whole genomes over whole genomes. That is the
  homogenising move, and it is gone.)

  WHY THE PACKETS ARE REAL. pull() calls the engine's own buildMigrantPacket() and stamps the
  engine's own netPacket() envelope — the identical object networkBroadcast would have put on the
  wire, with the source universe's real TAB_ID. feed() puts it through the recipient's own
  handleNetworkMessage(). validNetworkPayload, the queue caps, the peer bookkeeping and the
  tab===TAB_ID self-drop all still apply. The relay cannot inject anything a peer could not have
  sent, because a peer built it. All the field changes is WHO HEARS IT.

  SAVING. The collective's own 💾 button saves the collective, which is the point: one file, one
  lineage, the distilled thing. It also autosaves to its own localStorage slot (selection_collective)
  every 60 seconds and comes back into the collective — and only the collective — on reload, so the
  eight individuals keep sharing the engine's single slot exactly as they always have and the
  collective's lineage can never be overwritten by whichever individual wrote last.

      /                 eight universes and the collective
      /#n=2             two and the collective
      /#n=4             four and the collective
      /#n=6             six and the collective
      /#solo            no collective, no relay — just the individuals
      /#n=4,hud         put the HUD back on every frame (a field is clean by default)
      /#pool=2          pack the universes onto exactly two workers (default: one per core, max 4)
      /#nopool          one worker per universe, the pre-#162 layout — for comparison, and costs more
      /#bgpace=400      how hard to slow the OTHER universes while one is open (default 200ms, 0 = off)
      /                 THE CUBE — no hash needed. Nine universes on the face and layers under
                        them, drawing nothing, running slow, trading on the same wire. It turns
                        itself every five minutes so every layer gets its turn at the front.
                        DEPTH adapts to the device, the cube does not: two layers (27 universes,
                        ~1750 MB) on a machine reporting 8GB, one (18) on 4GB or on a browser that
                        will not say. A phone with 6GB reports 4, because it rounds down.
      /#layers=2        force the full depth on a device that under-reports
      /#layers=0        no layers at all — just the nine (~895 MB)
      /#turn=600        seconds each face gets before the cube turns itself (default 300, 0 = never)

  TAP a universe to open it full size, with its instruments AND its save/load buttons on; tap 'field'
  (or Escape) to go back. Nothing reloads either way — the others keep running and trading while you
  look. In the grid a cell is a tab and nothing else: the buttons are not rendered there at all,
  because the tap target sits over them and opening the universe is the only thing a tap in the grid
  can mean. Eighteen buttons that could be seen and not pressed read as broken, and were.
      /#<genome>        ONE universe loaded from that lineage — old saved links keep working
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  #grid{display:grid;height:100%;width:100%;gap:1px;background:#191a1c}
  .cell{position:relative;min-width:0;min-height:0}
  /* #165 — THE INNER LAYERS. Universes with no cell. They must still be LAID OUT, because a frame
     with no layout reports innerWidth 0 and the engine would size its world to a single pixel — so
     they are given a real cell's dimensions and moved off-screen, not display:none. They draw
     nothing anyway (#dark), so the only thing left off-screen is a canvas nobody writes to. */
  #below{position:fixed;left:-20000px;top:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
  #below .deep{position:absolute;top:0}
  /* ROTATED (#167): the container comes to the front and the chosen layer's frames are laid out over
     the grid. An iframe CANNOT be reparented — moving one in the DOM reloads it, which would reboot
     that universe from storage and destroy the lineage it has been growing — so a rotation is done
     entirely by repositioning and re-lighting frames where they already are. */
  #below.front{left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:auto;
        z-index:4;background:#191a1c}
  #below.front .deep{display:none}
  #below.front .deep.face{display:block}
  #depth{position:fixed;right:8px;bottom:8px;z-index:9;cursor:pointer;
        font:9px/1.3 ui-monospace,Menlo,monospace;color:#9bd;background:rgba(8,12,18,.78);
        border-radius:5px;padding:5px 7px;letter-spacing:.3px;display:none}
  #depth b{color:#dfe;font-weight:normal}
  #depth .now{color:#7fd4a8}
  /* #168 — HARVEST. The only way to compare a layer against the surface after a long run. */
  #harvest{position:fixed;left:8px;bottom:8px;z-index:9;cursor:pointer;display:none;
        font:10px/1 ui-monospace,Menlo,monospace;color:#cfe;background:rgba(10,14,16,.86);
        border:1px solid #2a4a44;border-radius:7px;padding:9px 12px}
  #harvest.busy{color:#8fb;border-color:#2f6}
  iframe{border:0;width:100%;height:100%;display:block;background:#000}
  /* The tap target sits OVER the frame so one tap always lands on the field rather than on whatever
     the engine has drawn there. #153: it is HIDDEN while a universe is open. It used not to be —
     open() only toggled classes — so the overlay went on covering the opened cell and quietly ate
     every tap meant for that universe's own save and load buttons. They were visible and dead. */
  .tap{position:absolute;inset:0;background:transparent;cursor:pointer}
  #grid.open .cell.on .tap{display:none}
  /* Open: this cell covers the whole grid. Nothing is reloaded — the others keep running underneath. */
  #grid.open .cell{display:none}
  #grid.open .cell.on{display:block;grid-column:1/-1;grid-row:1/-1}
  .cell.collective{outline:1px solid #2f6;outline-offset:-1px}
  /* #157: a universe that is catching exceptions is dim, not obviously broken. Say it out loud. */
  .cell.erroring{outline:2px solid #e44;outline-offset:-2px}
  .errbadge{position:absolute;left:3px;bottom:3px;z-index:3;pointer-events:none;
        font:9px/1.2 ui-monospace,Menlo,monospace;color:#fbb;background:rgba(60,0,0,.82);
        border-radius:4px;padding:3px 5px;max-width:94%}
  .cell.collective .badge{position:absolute;left:3px;top:3px;z-index:2;pointer-events:none;
        font:9px/1 ui-monospace,Menlo,monospace;color:#8fb;background:rgba(0,20,12,.7);
        border-radius:4px;padding:3px 5px;letter-spacing:.5px}
  #grid.open .cell.collective .badge{font-size:11px;left:8px;top:8px}
  #back{position:fixed;left:8px;top:8px;z-index:9;display:none;
        font:12px/1 ui-monospace,Menlo,monospace;color:#cfe;background:rgba(10,14,16,.82);
        border:1px solid #2a4a44;border-radius:7px;padding:8px 11px}
  #grid.open ~ #back{display:block}
  /* The collective says what it is taking in, on itself. This used to be a fixed panel at the
     bottom-left of the PAGE, where it sat on top of the last cell's own save button. */
  #fmsg{display:none}
</style>
<div id="grid"></div>
<div id="below"></div>
<div id="depth"></div>
<div id="harvest">harvest</div>
<div id="back">&#8592; field</div>
<div id="fmsg"></div>
<script>
(function(){
  'use strict';
  var raw=(location.hash||'').replace(/^#/,'');
  // A saved lineage is a long opaque blob. Anything that is not one of our own options is treated as
  // a genome and gets a single universe, so every link anyone has ever saved still opens its world.
  // ═══ #160 — THE FIELD NEEDS A WAY OUT ═══════════════════════════════════════════════════════
  // Reported: a heavy genome loaded into the field made the phone kill the tab, and because every
  // universe boots from the same stored lineage, EVERY RELOAD LOADED IT AGAIN AND DIED AGAIN. There
  // was no escape from inside the artwork. `universe.html#reset` clears the shared key, but not the
  // collective's own slot, so the collective dragged the same creature back on the next boot — and
  // `index.html#reset` did not work at all: "reset" was not in the options list below, so the field
  // treated it as a GENOME and tried to decode the word.
  // /#reset now clears BOTH keys and starts a clean field. It is the one thing the artwork must
  // always be able to do: let go of what it is holding.
  var OPT = '(n=\\d+|pool=\\d+|nopool|bgpace=\\d+|layers=\\d+|deeppace=\\d+|turn=\\d+|clean|cleanart|hud|solo|reset)';
  var isOptions = raw==='' || new RegExp('^'+OPT+'(,'+OPT+')*$').test(raw);
  if(isOptions && /(^|,)reset(,|$)/.test(raw)){
    // #170: every universe has its own slot now, so a reset that only cleared two keys would leave
    // most of the field carrying its old lineage — a "reset" that resets a quarter of the thing.
    try{
      var doomed=[];
      for(var ri=0;ri<localStorage.length;ri++){
        var rk=localStorage.key(ri);
        if(rk&&rk.indexOf('selection_')===0) doomed.push(rk);
      }
      for(var rj=0;rj<doomed.length;rj++) localStorage.removeItem(doomed[rj]);
    }catch(e){}
    // Strip it so the NEXT reload does not wipe the fresh field too — the same one-shot rule
    // universe.html already applies to its own #reset.
    try{ history.replaceState(null,'',location.pathname||' '); }catch(e){}
    raw=raw.replace(/(^|,)reset(?=,|$)/,'').replace(/^,/,'');
  }
  var n, clean=false, passHash='', wantCollective=false;
  if(isOptions){
    // ANCHOR IT. `n=` unanchored matches inside other options: `turn=0` contains "n=0", so
    // /#turn=0 silently built a FOUR-universe field (n=0 -> the !(n>=1) fallback) and /#turn=600
    // asked for six hundred. Found because a storage rig came back with five cells when it should
    // have had nine, which I nearly read as a bug in the storage. Every option here is a
    // comma-separated token, so every option's pattern must say so.
    var m=raw.match(/(?:^|,)n=(\d+)/);
    n = m ? parseInt(m[1],10) : 8;                 // eight INDIVIDUALS, by the author's call
    if(!(n>=1)) n=4;
    if(n>8) n=8;                                   // not a hard limit; past the core count the
                                                   // universes only slow each other down
    wantCollective = n>1 && !/(^|,)solo(,|$)/.test(raw);
    // CLEAN BY DEFAULT WHEN THERE IS MORE THAN ONE. #144 measured the HUD at 2,788 characters over
    // half a full phone screen; in a quarter-screen frame it is roughly twice the frame. Rendered
    // four-up it buries the artwork entirely, and four metabolism panels is four of everything.
    // So a field is clean unless asked otherwise; a single universe is untouched.
    clean = /clean/.test(raw) || (n>1 && !/(^|,)hud(,|$)/.test(raw));
  } else {
    n=1; passHash='#'+raw;                         // a lineage, opened by itself
  }
  var total=n+(wantCollective?1:0);

  // ═══ #162 — HOW MANY WORKERS ═══════════════════════════════════════════════════════════════
  // The field has TWO ceilings and they pull in opposite directions. Memory is per-ISOLATE: nine
  // universes on nine workers cost 1,309 MB, the same nine on three cost 815 MB, because what
  // grows is V8 heap slack rather than anything the simulation owns. Throughput is per-CORE: total
  // ticks across the whole field are flat from about four workers onward no matter how many
  // universes run, and packing all nine onto ONE worker halved them.
  //
  // So the rule is the point where those two curves cross: never more isolates than cores, never
  // more isolates than universes. That removes the oversubscription that was costing memory AND
  // throughput at the same time, and it can never make a small field worse — three universes still
  // get three workers, exactly as before. The cap of 4 is the measured plateau; a phone reports 8
  // hardware threads but four of them are little cores.
  // A SharedWorker outlives the DOCUMENT that created it — it dies only when its last port closes.
  // On a reload the new page's iframes can connect before the old page's ports have finished
  // disentangling, and then the new field joins a worker that is still running the OLD page's
  // universes: nine zombie loops that nothing can see, reach or stop, one more set per refresh.
  // So the pool name carries a nonce minted once per page load. Every cell in THIS load shares it
  // and pools together; a reload mints a new one, gets clean workers, and the old worker's last
  // port closes with nobody left to keep it alive, so the browser reaps it and its universes.
  // ═══ #164 — LOOKING AT A UNIVERSE WAKES IT UP ═══════════════════════════════════════════════
  // The field's tick budget is FIXED — four workers buy about five times one universe and that is
  // the whole phone — so the only lever past a handful of universes is who gets the ticks.
  //
  // The trap is that slowing everything down is not allocation, it is just loss: a field where every
  // cell is paced runs slower and nobody is better off. Pace only pays when the budget it frees goes
  // somewhere. So nothing is paced while you are looking at the whole field — that is today's
  // behaviour exactly — and the moment you open ONE universe, the other eight stand down and hand
  // their ticks to it. Tapping a cell stops meaning "make this bigger" and starts meaning "wake this
  // up", which is what the instruments were always for.
  //
  // 200ms is five ticks a second for a universe nobody is looking at, against roughly twenty-three
  // in a full field. #bgpace=0 turns the whole thing off and every cell runs flat out always.
  //
  // Worth knowing, because it is a real consequence and not a side effect: #163 makes a paced
  // universe ISOLATED as well as slow — it accepts migrants in proportion to its own clock, so the
  // eight that stand down also stop taking much in while you look at the ninth. Over the seconds or
  // minutes of actually looking at something that is nothing; it would matter if a cell were left
  // open for hours, and that is the case to watch.
  var BGPACE = (function(){ var m=raw.match(/(?:^|,)bgpace=(\d+)/); var v=m?parseInt(m[1],10):200;
                            return Math.max(0,Math.min(5000,isFinite(v)?v:200)); })();
  // ═══ #165 — LAYERS ═════════════════════════════════════════════════════════════════════════
  // What you see is one face. `#layers=K` puts K more layers of the same count underneath: universes
  // with no cell, drawing nothing, running slow, on the same wire as everything above them.
  //
  // NOTHING SURFACES BY BEING TAPPED. The network is already the surfacing mechanism, and the
  // asymmetry that makes it work fell out of #163 rather than being designed: a paced universe still
  // BROADCASTS — networkBroadcast is per tick and gated per tick, so a slow world speaks slowly
  // rather than not at all — while the #163 receive gate is keyed to the RECEIVER's own pace, so a
  // surface universe, being unpaced, refuses nothing. The layers below are therefore SOURCES:
  // isolated enough to drift into something of their own, still audible upward. The top takes up
  // what is happening underneath without anybody asking it to.
  //
  // They are the cheapest thing this field can run. Drawing is 40% of a tick (measured), so a dark
  // universe ticks 1.68x faster than a lit one, and memory tracks PARTICLES rather than universes
  // (#162), so a small world underneath costs a fraction of a cell on top. The isolates are already
  // paid for: a deep universe is another CONNECTION to a worker that exists, not another worker.
  //
  // Deeper is slower — DEEPPACE milliseconds per layer, compounding. At the default that is 400ms
  // for the first layer down and 800 for the second: two and a half ticks a second, and one and a
  // quarter. In the creature's own units, which are ticks and not seconds, that is still 100,000+
  // ticks a day for something nobody is watching.
  // THE LINK IS THE CUBE. Open the page, get twenty-seven universes: nine on the face and two layers
  // underneath. No hash, no flag, no device sniffing — the author's rule, and it is the right one.
  // A piece of work you have to remember a URL to see is not shipped, and the first version of this
  // shipped exactly that way: the layers were opt-in, a bare GitHub Pages link carried no hash, and a
  // twenty-one hour overnight run came back as nine universes with nothing underneath them.
  //
  // I had then made the depth conditional on navigator.deviceMemory, which was the same mistake in a
  // more defensible coat — an added measure between the link and the thing. Gone.
  //
  // The cost, so it is written down rather than discovered: measured, twenty-seven universes plateau
  // around 1,750 MB against ~895 for nine. #layers=1 is eighteen and #layers=0 is the old nine, both
  // one edit away if a device will not hold it.
  var LAYERS = (function(){
    var m=raw.match(/(?:^|,)layers=(\d+)/);
    if(m){ var v=parseInt(m[1],10); return Math.max(0,Math.min(8,isFinite(v)?v:2)); }
    // No hash, so the DEPTH adapts and the cube does not. navigator.deviceMemory is quantised and
    // rounded DOWN to a power of two, so a 6GB phone reports 4 and a desktop reports 8. A browser
    // that will not say (Safari does not implement it) is treated as capable-but-unknown and gets
    // one layer, because the machines that withhold it are mostly desktops. Only a device that
    // explicitly reports under 4GB gets nothing underneath — at that size eighteen universes would
    // not survive, and half a cube that dies is worse than nine that live.
    var gb=navigator.deviceMemory;
    if(gb===undefined||gb===null) return 1;
    return (+gb)>=8?2:((+gb)>=4?1:0);
  })();
  var DEEPPACE = (function(){ var m=raw.match(/(?:^|,)deeppace=(\d+)/); var v=m?parseInt(m[1],10):400;
                              return Math.max(50,Math.min(5000,isFinite(v)?v:400)); })();
  var POOL_RUN = Math.random().toString(36).slice(2,10);
  var pool;
  var pm = raw.match(/(?:^|,)pool=(\d+)/);
  var everything = total * (1 + LAYERS);        // #165: the surface plus every layer under it
  if (/(^|,)nopool(,|$)/.test(raw)) pool = everything;               // the pre-#162 layout, for comparison
  else if (pm) pool = Math.max(1, Math.min(everything, parseInt(pm[1],10)||1));
  else pool = Math.max(1, Math.min(everything, Math.min(4, (navigator.hardwareConcurrency||4))));

  var cols=Math.ceil(Math.sqrt(total));
  var grid=document.getElementById('grid');
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  var frag=document.createDocumentFragment(), cells=[], collectiveCell=null;
  for(var i=0;i<total;i++){
    var isColl = wantCollective && i===total-1;
    var cell=document.createElement('div'); cell.className='cell'+(isColl?' collective':'');
    var f=document.createElement('iframe');
    // Cells sharing a slot share one SharedWorker, one connection and one universe each. The slot
    // rides in the QUERY string, not the hash: the hash is forwarded verbatim into the engine and
    // every flag it carries is the creature's, not the field's.
    // #170: and its own storage slot, so a reload continues this universe's lineage instead of
    // handing every cell whichever one autosaved last. The collective keeps the key it already had
    // (#153 gave it one precisely because the shared key kept overwriting it), which is now just the
    // general case rather than a special one.
    f.src='universe.html?pool='+POOL_RUN+'x'+(i%pool)
         +'&slot='+(isColl?'collective':('u'+i))
         +(passHash||(clean?'#cleanart':''));
    f.title=isColl?'The collective':('Universe '+(i+1));
    f.setAttribute('allow','autoplay');
    cell.appendChild(f);
    if(isColl){ var b=document.createElement('div'); b.className='badge'; b.textContent='collective'; cell.appendChild(b); }
    if(total>1){ var t=document.createElement('div'); t.className='tap'; cell.appendChild(t); }
    frag.appendChild(cell); cells.push(cell);
    if(isColl) collectiveCell=cell;
  }
  grid.appendChild(frag);
  var individuals=cells.slice(0, wantCollective?cells.length-1:cells.length);

  // ── build the layers underneath ───────────────────────────────────────────────────────────────
  // Sized like a surface cell so each deep universe gets a real world rather than a one-pixel one,
  // and parked off-screen rather than display:none for the same reason: a frame with no layout
  // reports innerWidth 0. #dark means it never draws into the canvas it has.
  var below=document.getElementById('below'), deep=[], deepFrag=document.createDocumentFragment();
  var cw=Math.max(80, Math.round(window.innerWidth/cols)),
      ch=Math.max(80, Math.round(window.innerHeight/Math.ceil(total/cols)));
  if(LAYERS>0){
    for(var L=1;L<=LAYERS;L++){
      for(var k=0;k<total;k++){
        var d=document.createElement('iframe');
        d.className='deep';
        d.style.width=cw+'px'; d.style.height=ch+'px';
        d.style.left=((L-1)*total+k)*(cw+4)+'px';       // laid out side by side, all of it off-screen
        // Two different "slots" meet on this line, so they are named apart: which WORKER this
        // universe shares (#162) and which STORAGE key holds its lineage (#170).
        var poolSlot=(cells.length+(L-1)*total+k)%pool;
        d.src='universe.html?pool='+POOL_RUN+'x'+poolSlot+'&slot=L'+L+'_'+k
             +'#cleanart,dark,pace='+(DEEPPACE*L);
        d.title='Layer '+L+', universe '+(k+1);
        deepFrag.appendChild(d); deep.push(d);
      }
    }
    below.appendChild(deepFrag);
  }

  // ═══ #167 — ROTATE THE CUBE ════════════════════════════════════════════════════════════════
  // A rumour is not an artwork. #165 built eighteen universes you could not see and gave you a
  // counter, which says they are alive and nothing else. This turns the cube: tap the readout and a
  // layer comes to the face — laid out over the grid, lit, and running at full pace, while the layer
  // it replaced goes dark and slow. Tap through the layers and back to the surface.
  //
  // NOTHING IS REPARENTED, and that is the constraint the whole design bends around: moving an
  // iframe in the DOM RELOADS it, which reboots that universe from the shared localStorage slot and
  // destroys the lineage it has been growing — the same trap #150 named for why opening a cell must
  // never reload. So a rotation only ever restyles and re-flags frames where they already sit. The
  // deep frames are complete universes with real canvases; they were merely dark and off-screen.
  //
  // Only the face is lit. A layer that is not being looked at pays neither its render (40% of a
  // tick) nor a full pace, which is what keeps twenty-seven universes affordable while you look at
  // any nine of them.
  var depthEl=document.getElementById('depth');
  var face=0;                                     // 0 = the surface, 1..LAYERS = a layer below
  function layerFrames(L){ return deep.slice((L-1)*total, L*total); }
  // WHAT THIS DOES NOT DO IS POSITION THE FRAME. It used to, and it undid its own caller: rotate()
  // laid the nine face frames out in a grid and then called this, which promptly cleared left and
  // top on every one of them. All nine stacked at the same spot — one visible cell in the corner and
  // the rest of the screen black. The rig did not catch it because it asserted the FACE CLASS and
  // the tick rates, both of which were perfectly correct, and never asked where anything was.
  // Placement belongs to whoever is arranging the layout; this only says lit-or-dark and how fast.
  function light(f,on,L){
    try{
      f.classList.toggle('face',on);
      var w=f.contentWindow, a=w&&w.__field;
      // #dark rides the hash (the engine re-reads it on hashchange); pace goes through the API.
      var h='#cleanart'+(on?'':',dark,pace='+(DEEPPACE*L));
      if((w.location.hash||'')!==h) w.location.hash=h;
      if(a&&a.pace) a.pace(on?0:DEEPPACE*L);
    }catch(e){}
  }
  // The SURFACE also stops drawing when it is not the face. `visibility:hidden` hides a frame from
  // the viewer, not from the engine inside it — the sim goes on painting an OffscreenCanvas nobody
  // will ever composite, which is the 40% of a tick that #165 exists to stop paying. So the surface
  // is darkened and paced exactly like a layer when a layer is in front of it. Without this, turning
  // the cube would ADD a lit face rather than move one, and twenty-seven universes would cost more
  // to look at than to ignore.
  // THE HASH IS THE SOURCE OF TRUTH FOR BOTH FLAGS, and getting that wrong cost a real bug that the
  // rig caught and I had already waved off as a transition. A universe can be paced two ways — the
  // hash, which the engine RE-READS on every hashchange, and the field API. Set them to disagree and
  // the hashchange wins, because it arrives last: this wrote '#cleanart,dark' (no pace token) and
  // then called pace(400), and the hashchange handler read the token-free hash as pace 0 and undid
  // it. The surface went dark and kept running flat out, so turning the cube ADDED a face instead of
  // moving one. Whenever the field changes one of these flags, every flag it cares about goes in the
  // hash — the API call after it is then only there to make it immediate.
  function lightSurface(on){
    var h='#cleanart'+(on?'':',dark,pace='+DEEPPACE);
    for(var i=0;i<cells.length;i++){
      try{
        var w=cells[i].firstChild.contentWindow, a=w&&w.__field;
        if((w.location.hash||'')!==h) w.location.hash=h;
        if(a&&a.pace) a.pace(on?0:DEEPPACE);
      }catch(e){}
    }
  }
  function rotate(to){
    if(!LAYERS)return;
    to=((to%(LAYERS+1))+(LAYERS+1))%(LAYERS+1);
    if(to===face)return;
    // put the outgoing layer back to sleep
    if(face>0) layerFrames(face).forEach(function(f){ light(f,false,face); });
    face=to;
    if(face===0){
      below.classList.remove('front');
      grid.style.visibility='';
      lightSurface(true);
      allocate(null);                             // the surface takes its ticks back
    }else{
      lightSurface(false);                        // the face moves; it does not multiply
      // lay this layer out over the grid, in the same shape the surface has
      var fs=layerFrames(face);
      fs.forEach(function(f,i){
        f.style.width=Math.floor(window.innerWidth/cols)+'px';
        f.style.height=Math.floor(window.innerHeight/Math.ceil(total/cols))+'px';
        f.style.left=((i%cols)*Math.floor(window.innerWidth/cols))+'px';
        f.style.top=(Math.floor(i/cols)*Math.floor(window.innerHeight/Math.ceil(total/cols)))+'px';
        light(f,true,face);
      });
      below.classList.add('front');
      grid.style.visibility='hidden';             // hidden, NOT display:none — the surface keeps running
    }
    paint();
  }
  function paint(){
    if(!LAYERS)return;
    depthEl.innerHTML = (face===0?'<span class="now">surface</span>':'<span class="now">layer '+face+'</span>')
      + ' · <b>'+(face===0?deep.length:(cells.length+deep.length-total))+'</b> out of sight · tap to turn';
  }

  // ── AND IT TURNS ON ITS OWN ───────────────────────────────────────────────────────────────
  // The author's read, which is better than the one this was built for: rotating means all layers
  // get a chance. The face is not just what you can SEE, it is what runs lit and at full pace while
  // everything else runs dark and slow — so turning the cube is how the tick budget CIRCULATES.
  // Left on one face, that face takes everything and the rest starve; and a field on a phone is left
  // running for hours with nobody turning it.
  //
  // So it turns itself, slowly. #turn=N sets the seconds per face (default 300 — five minutes, long
  // enough that it reads as a slow object rather than a slideshow); #turn=0 stops it and leaves the
  // cube wherever you put it. A tap always turns it immediately and restarts the clock, so the hand
  // beats the timer.
  var TURN = (function(){ var m=raw.match(/(?:^|,)turn=(\d+)/); var v=m?parseInt(m[1],10):300;
                          return Math.max(0,Math.min(86400,isFinite(v)?v:300)); })();
  var turnTimer=null;
  function armTurn(){
    if(turnTimer){ clearInterval(turnTimer); turnTimer=null; }
    if(LAYERS>0&&TURN>0) turnTimer=setInterval(function(){ if(!openCell) rotate(face+1); },TURN*1000);
  }

  // ═══ #168 — HARVEST ════════════════════════════════════════════════════════════════════════
  // One tap takes every universe in the field — the surface AND every layer under it — and puts them
  // in a single file.
  //
  // Without this a long run produces nothing comparable. A universe's own save button lives on an
  // OPENED surface cell (#154), and the layers have no controls at all: after eight hours you could
  // read the counter and learn that eighteen things were alive, which is the same thing you knew
  // before you started. The question the layers exist to answer — does a world that ticks slowly and
  // trades freely end up somewhere the surface did not — needs the genomes side by side.
  //
  // Sequential, not parallel: encodeGenome on a mature creature is not cheap (SAVE_BUDGET is half a
  // million characters) and twenty-seven at once on four workers would stall the field for as long
  // as it took. A paced universe answers with up to its own pace in latency, because the message is
  // handled between its ticks — which is why the button reports progress rather than appearing hung.
  var harvestEl=document.getElementById('harvest');
  function harvestOne(frame){
    return new Promise(function(res){
      var done=false, fin=function(v){ if(!done){ done=true; res(v); } };
      setTimeout(function(){ fin(null); }, 20000);      // a universe that will not answer is recorded as null
      try{
        var w=frame.contentWindow, a=w&&w.__field;
        if(!a){ fin(null); return; }
        Promise.all([a.save(), a.stat()]).then(function(r){
          var txt=r[0], st=r[1]||{};
          var g=null; try{ g=JSON.parse(txt).genome; }catch(e){ g=null; }
          fin(g?{ genome:g, ticks:st.totalTicks|0, gen:st.gen|0, N:st.N|0,
                  atoms:st.atoms|0, pace:st.pace|0, dark:!!st.dark, fp:st.fp||'' }:null);
        }, function(){ fin(null); });
      }catch(e){ fin(null); }
    });
  }
  async function harvest(){
    if(harvestEl.classList.contains('busy'))return;
    harvestEl.classList.add('busy');
    var frames=[], where=[];
    for(var i=0;i<cells.length;i++){
      frames.push(cells[i].firstChild);
      where.push(wantCollective&&i===cells.length-1?'collective':('surface/'+i));
    }
    for(var j=0;j<deep.length;j++){
      frames.push(deep[j]);
      where.push('layer'+(Math.floor(j/total)+1)+'/'+(j%total));
    }
    var out={ type:'selection-field', version:1, exportedAt:new Date().toISOString(),
              hash:location.hash||'', universes:[] }, got=0;
    for(var k=0;k<frames.length;k++){
      harvestEl.textContent='harvest '+(k+1)+'/'+frames.length;
      var one=await harvestOne(frames[k]);
      if(one){ one.at=where[k]; out.universes.push(one); got++; }
      else out.universes.push({ at:where[k], genome:null, note:'no answer' });
    }
    try{
      var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='selection_field_'+got+'of'+frames.length+'_'+Date.now()+'.json';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },8000);
      harvestEl.textContent='harvested '+got+'/'+frames.length;
    }catch(e){ harvestEl.textContent='harvest failed'; }
    setTimeout(function(){ harvestEl.classList.remove('busy'); harvestEl.textContent='harvest'; },6000);
  }
  if(total>1){
    harvestEl.style.display='block';
    harvestEl.addEventListener('click',function(e){ e.stopPropagation(); harvest(); });
  }

  // A readout for the part you cannot see, and the handle that turns it.
  if(LAYERS>0){
    depthEl.style.display='block';
    paint();
    armTurn();
    depthEl.addEventListener('click',function(e){ e.stopPropagation(); rotate(face+1); armTurn(); });
    // WHAT IT COUNTS FOLLOWS THE FACE. This polled the layer frames and said "below" whatever was
    // showing, so the moment a layer came up it was describing the nine universes you were LOOKING
    // AT and calling them hidden. Reported from the phone as "the 33k ticks — that's what's going on
    // underneath?", and no: it was the total for the face itself.
    // The readout is here to describe the part you CANNOT see, so it now takes everything that is
    // not the current face — the layers when you are on the surface, and the surface plus any other
    // layer when you are on one.
    function hidden(){
      var out=[];
      if(face!==0) for(var i=0;i<cells.length;i++) out.push(cells[i].firstChild);
      for(var L=1;L<=LAYERS;L++) if(L!==face) out=out.concat(layerFrames(L));
      return out;
    }
    setInterval(function(){
      var watch=hidden();
      var alive=0,ticks=0,pop=0,errs=0,pending=watch.length;
      if(!pending)return;
      watch.forEach(function(f){
        var done=false;
        var fin=function(){ if(done)return; done=true; if(--pending===0){
          depthEl.innerHTML = (face===0?'<span class="now">surface</span>':'<span class="now">layer '+face+'</span>')
            + ' · <b>'+alive+'/'+watch.length+'</b> out of sight · '
            + (ticks>9999?(Math.round(ticks/1000)+'k'):ticks) + ' ticks · ' + pop + ' alive'
            + (errs?(' · '+errs+' erroring'):'') + ' · tap to turn'; } };
        try{
          var a=f.contentWindow&&f.contentWindow.__field;
          if(!a){ fin(); return; }
          var t=setTimeout(fin,7000);   // a paced universe answers between its own ticks; 2.5s
                                        // called healthy universes dead whenever the field was busy
          a.stat().then(function(st){ clearTimeout(t);
            if(st){ alive++; ticks+=st.totalTicks|0; pop+=st.N|0; if(st.errs>0)errs++; } fin(); },fin);
        }catch(e){ fin(); }
      });
    },5000);
  }

  // #150 — TAP A UNIVERSE TO LOOK INSIDE IT.
  // A field is clean because eight HUDs at ninth-size are unreadable (#144 measured the HUD at half
  // a FULL phone screen). But clean should not mean unavailable: the instruments are the point of the
  // thing. Tapping opens one universe to full size AND turns its own readouts back on by clearing its
  // hash — which the metabolism panel (main thread) and the HUD (inside the worker, via the #150
  // forward) both honour live. NOTHING RELOADS: the others keep running and keep trading, and the
  // opened one keeps the lineage it has been growing. A reload would drop it back to the shared
  // localStorage slot, which by then holds some other universe's genome.
  var openCell=null;
  function setFrameHash(cell,h){
    var w=cell.firstChild.contentWindow;
    try{ if((w.location.hash||'')!==h) w.location.hash=h; }catch(e){}
  }
  // #154: the controls come WITH the universe. In the grid a cell is a tab and nothing else — the
  // save/load buttons are not rendered there, because the tap target sits over them and opening the
  // universe is the only thing a tap in the grid can mean. Open it and it gets its buttons.
  function controls(cell,show){ var a=api(cell); if(a&&a.controls) a.controls(show); }
  // #164: hand the field's ticks to whichever universe is being looked at — but only the ticks it
  // can actually use.
  //
  // The first version of this stood ALL eight others down, and measured: the open cell went from
  // 16.2 to 52.8 ticks/second while the field's total fell from 189 to 90. It gained 36 and the
  // others gave up 136. That is not allocation, it is mostly waste — one universe runs on ONE
  // worker, so it cannot absorb four workers' worth however much they stand aside.
  //
  // Only a universe SHARING THE OPEN ONE'S WORKER is competing with it for anything (#162: cells
  // are packed onto a pool of SharedWorkers, and a worker is one thread). So stand down that
  // worker's other cells and leave the rest of the field running at full speed. The open universe
  // still gets its thread to itself; the six or seven universes on other workers never notice.
  function slotOf(cell){ var i=cells.indexOf(cell); return i<0?-1:(i%pool); }
  function allocate(focus){
    if(!BGPACE)return;
    var slot = focus ? slotOf(focus) : -1;
    for(var i=0;i<cells.length;i++){
      var a=api(cells[i]); if(!a||!a.pace)continue;
      var standDown = !!focus && cells[i]!==focus && (i%pool)===slot;
      try{ a.pace(standDown ? BGPACE : 0); }catch(e){}
    }
  }
  function open(cell){
    openCell=cell;
    // #168: get out of the way. This button sits bottom-left, which is where an OPENED universe's own
    // save and load buttons are — the exact geometry of #150 and #154, where a control covered a
    // control and eighteen buttons could be seen and never pressed. A field-level control has no
    // business being on screen while you are inside one universe.
    harvestEl.style.display='none';
    for(var i=0;i<cells.length;i++) cells[i].classList.toggle('on',cells[i]===cell);
    grid.classList.add('open');
    setFrameHash(cell,'');                      // instruments on
    controls(cell,true);
    allocate(cell);                             // the other eight stand down
  }
  function close(){
    if(!openCell)return;
    controls(openCell,false);
    setFrameHash(openCell, clean?'#cleanart':'');   // back to however the field is configured
    grid.classList.remove('open');
    for(var i=0;i<cells.length;i++) cells[i].classList.remove('on');
    openCell=null;
    if(total>1) harvestEl.style.display='block';
    allocate(null);                             // everybody back to full
  }
  grid.addEventListener('click',function(e){
    if(openCell)return;                          // inside an open universe, its own controls win
    var t=e.target;
    if(!t||t.className!=='tap')return;
    open(t.parentNode);
  });
  document.getElementById('back').addEventListener('click',function(e){ e.stopPropagation(); close(); });
  addEventListener('keydown',function(e){ if(e.key==='Escape')close(); });

  // ═══ #153 — THE COLLECTIVE ══════════════════════════════════════════════════════════════════
  var msgEl=document.getElementById('fmsg');
  // Write the field's readout into the COLLECTIVE'S OWN BADGE rather than a panel floating over
  // whichever cell happens to be bottom-left. It reads as a label on the thing it describes, and it
  // grows with the cell when you open it.
  var badgeEl=null;
  function msg(t){
    if(!badgeEl && collectiveCell) badgeEl=collectiveCell.querySelector('.badge');
    if(badgeEl) badgeEl.textContent = t ? ('collective '+t) : 'collective';
    if(msgEl) msgEl.textContent=t||'';
  }
  function api(cell){ try{ return cell.firstChild.contentWindow.__field||null; }catch(e){ return null; } }

  if(!wantCollective){ if(msgEl) msgEl.style.display='none'; return; }

  // ═══ #157 — A UNIVERSE THAT IS QUIETLY FAILING MUST SAY SO ══════════════════════════════════
  // The field runs every universe with #cleanart, which hides the HUD — and the HUD was the ONLY
  // place a caught tick was reported. So a universe could throw on every tick, keep counting, stop
  // saving, and look merely dim. That is exactly what happened: 300,000 ticks, blank frames, and a
  // reload that came back at 198,000. Nothing about the field showed it.
  // Every 10 seconds each universe is asked for its caught-tick count, and any that is above zero
  // gets a red outline and a label. Cheap, and it turns a silent failure into a visible one without
  // switching the instruments back on.
  var errBadges={};
  function checkErrors(){
    cells.forEach(function(c,i){
      var a=api(c); if(!a||!a.stat) return;
      a.stat().then(function(s){
        if(!s) return;
        var n=s.errs|0;
        if(n>0){
          c.classList.add('erroring');
          var b=errBadges[i];
          if(!b){ b=document.createElement('div'); b.className='errbadge'; c.appendChild(b); errBadges[i]=b; }
          b.textContent='\u26a0 '+n+' caught'+(s.errMsg?(': '+String(s.errMsg).slice(0,60)):'');
        } else if(c.classList.contains('erroring')){
          c.classList.remove('erroring');
          if(errBadges[i]){ errBadges[i].remove(); delete errBadges[i]; }
        }
      }).catch(function(){});
    });
  }
  setInterval(checkErrors, 10000);
  setTimeout(checkErrors, 4000);

  var COLLECT_MS=1000;      // one emigrant out of each individual, per cycle
  var RETURN_EVERY=4;       // ...and one out of the collective every 4th cycle, to ONE individual
  var cycles=0, inCount=0, outCount=0, returnTo=0;

  // Eight in, one out. A pull that comes back null is a cycle where that world sent nothing — either
  // it had no eligible particle, or (#158) its own evolved netMigrantRate said not to speak. Both are
  // the same answer networkBroadcast would have given, which is the point: the relay decides who
  // HEARS a migrant, never whether one is made. A universe that evolves its way to silence goes
  // silent here too.
  function relay(){
    var coll=api(collectiveCell); if(!coll) return;
    cycles++;
    for(var i=0;i<individuals.length;i++){
      var a=api(individuals[i]); if(!a) continue;
      a.pull().then(function(p){ if(p){ coll.feed(p); inCount++; } }).catch(function(){});
    }
    if(cycles%RETURN_EVERY===0 && individuals.length){
      var target=api(individuals[returnTo%individuals.length]); returnTo++;
      if(target) coll.pull().then(function(p){ if(p){ target.feed(p); outCount++; } }).catch(function(){});
    }
    if(cycles%5===0) msg('\u2190'+inCount+' \u2192'+outCount);
  }

  // THE COLLECTIVE'S OWN SLOT. The engine autosaves every universe into one shared localStorage key
  // and reads it back on boot, so on a reload the collective would come up as a copy of whichever
  // individual wrote last — the distilled lineage overwritten by an arbitrary one. This is a second
  // slot that only the collective writes and only the collective reads.
  // Nothing in here may be one-shot. The whole collective — the relay, the autosave, the restore —
  // hangs off this call, and a phone that had not finished loading the ninth iframe by the time it
  // ran would have got a field with a ninth universe in it that was not fed by anything, silently
  // and for the rest of the session. So it waits for the frame instead of asking once.
  var startTries=0;
  // #170: the loading and the saving are gone from here, because they are no longer special. The
  // collective's frame now carries slot=collective and reads and writes selection_collective itself,
  // exactly as every other universe reads and writes its own — which is what #153's bespoke slot was
  // reaching for when the engine still had only one key to share. What is left is the part that was
  // never about storage: waiting for the ninth frame before starting the relay. That wait is still
  // load-bearing and must not become one-shot, because a phone that had not finished loading the
  // collective when this ran would get a field whose ninth universe is fed by nothing, silently and
  // for the rest of the session.
  function restoreCollective(){
    var coll=api(collectiveCell);
    if(!coll){ if(++startTries<100) setTimeout(restoreCollective,300); return; }
    coll.ready().then(function(){ setInterval(relay, COLLECT_MS); })
                .catch(function(){ setInterval(relay, COLLECT_MS); });
  }
  setTimeout(restoreCollective, 1200);
})();
</script>
