<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Selection</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:monospace}
  #c{display:block;width:100vw;height:100vh;background:#000}
  #gen{position:fixed;left:6px;top:4px;color:#8fb;font-size:11px;z-index:5;white-space:pre;pointer-events:none;text-shadow:0 0 3px #000}
  /* #154 — A TAP TARGET YOU CAN ACTUALLY HIT. These were 11px type in 25px-tall boxes eight pixels
     off the bottom edge of the viewport, which on a phone is where the browser's own toolbar and the
     Android gesture bar live. Now ~40px tall and lifted clear of the safe-area inset. They cost
     nothing in a field, because in a field they are not rendered at all (see below). */
  #gio{position:fixed;right:10px;z-index:6;display:flex;gap:8px;
       bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  #gio button{font:13px monospace;background:#122;color:#8fb;border:1px solid #275;border-radius:7px;
              padding:11px 14px}
  #gio[hidden]{display:none}
  #gfile{display:none}
  #err{position:fixed;left:8px;right:8px;top:40%;z-index:9;color:#f88;background:#200;border:1px solid #522;
        border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="gen">booting…</div>
<div id="gio"><button id="gexp">💾 save</button><button id="gimp">📂 load</button><input type="file" id="gfile" accept=".json"></div>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(function(){
  'use strict';
  var canvas = document.getElementById('c');
  var genEl  = document.getElementById('gen');
  var errEl  = document.getElementById('err');
  var gioEl  = document.getElementById('gio');

  // ═══ #154 — NO CONTROLS IN A FIELD ══════════════════════════════════════════════════════════
  // A field lays a transparent tap target over every cell, so in the grid these buttons could be
  // SEEN but never PRESSED: the tap opened the universe instead of saving it. #153 fixed the overlay
  // covering them once a universe was open, which was a real bug, but left the deeper one — in the
  // grid they were an affordance that lied. Nine cells, eighteen buttons, none of them doing what
  // they looked like they did, and each pair eating a sixth of its cell.
  // So: framed means no controls. The cell is a tab; you tap it, it opens, and THEN it has its
  // buttons — the field turns them on through __field.controls() and off again when you go back.
  // Defaulting to hidden rather than being switched off by the parent means there is no race and no
  // first paint with them visible. A standalone universe.html is not framed and is untouched.
  var FRAMED = false; try { FRAMED = (window.self !== window.top); } catch(e){ FRAMED = true; }
  if (FRAMED && gioEl) gioEl.hidden = true;
  function fail(msg){ errEl.style.display='block'; errEl.textContent = msg; }

  // ── feature check ──────────────────────────────────────────────
  if (typeof Worker === 'undefined' || typeof OffscreenCanvas === 'undefined' || !canvas.transferControlToOffscreen) {
    fail("This device's browser doesn't support the background-worker mode (OffscreenCanvas).\n\nOpen engine.html instead — it runs the same simulation on the main thread.");
    genEl.textContent = 'unsupported';
    return;
  }

  // ── size the drawing buffer 1:1 with the viewport (matches index.html's resize()) ──
  function bufW(){ return Math.max(1, window.innerWidth|0); }
  function bufH(){ return Math.max(1, window.innerHeight|0); }
  canvas.width = bufW(); canvas.height = bufH();

  // ── load any saved genome BEFORE the worker boots, so the sim's synchronous boot read finds it ──
  var stored = null;
  try { stored = localStorage.getItem('selection_genome'); } catch(e){}

  // ── hand the canvas to the worker and start the sim there ──
  var off = canvas.transferControlToOffscreen();
  var worker = new Worker('sim.worker.js');
  // #150: keep the worker's view of the hash current. Without this the sim reads the hash once at
  // boot; the metabolism panel (which runs out here on the main thread) would honour a change while
  // the HUD inside the worker would not, so the two would disagree about whether they are hidden.
  addEventListener('hashchange', function(){
    try { worker.postMessage({ type:'hash', hash: location.hash || '' }); } catch(e){}
  });
  worker.postMessage({
    type:'init', canvas:off, w:bufW(), h:bufH(), dpr:1,
    genome: (stored && stored.length>10) ? stored : null,
    hash: location.hash || '', src:'engine.html'
  }, [off]);

  // #reset is a one-shot: the sim clears the saved lineage on boot, then strips #reset from the
  // URL so the NEXT reload doesn't wipe the newly evolved creature. The sim does that strip with
  // history.replaceState — a no-op in the worker — so the shell, which owns the real URL, must do
  // it here (mirroring loadGenome()). Without it, every reload of index.html#reset silently
  // re-wipes the fresh lineage. We still forwarded the #reset hash to the worker above, so the
  // one intended reset happens; we only stop it from repeating.
  if ((location.hash || '').slice(1) === 'reset') {
    try { history.replaceState(null, '', location.pathname || ' '); } catch(e){}
  }

  // ── messages back from the worker ──────────────────────────────
  var lastStatus = 0;
  // ═══ #152 — THE FIELD API ═══════════════════════════════════════════════════════════════════
  // Eight universes on one page are eight bodies of one thing. The field (index.html) uses these to
  // save all of them into ONE file and hand each its own lineage back, so a reload restores a FIELD
  // rather than eight copies of whichever universe happened to write to localStorage last.
  // Deliberately small: read this universe's genome, put a genome into it, and tell me when the sim
  // is up. Everything else stays where it is.
  // #153 fixed a real breakage this API caused. The first version matched a reply to a request by
  // "is a field promise outstanding?", so ANY export reply that arrived while one was pending was
  // swallowed by it — and the 60-second field autosave meant one was pending fairly often. Tapping
  // this universe's own 💾 could hand its file to the autosave and never download anything. Replies
  // now carry back the rid they were asked with (the worker echoes it), so a field ask and a button
  // press can never be confused for each other no matter how they interleave.
  var fieldWaiters={}, ridSeq=0, isReady=false, readyWaiters=[];
  function ask(kind, extra){
    return new Promise(function(r){
      var rid = 'f'+(++ridSeq);
      fieldWaiters[rid] = r;
      var m = { type:kind, rid:rid };
      for (var k in extra) m[k] = extra[k];
      worker.postMessage(m);
    });
  }
  function settle(rid, value){
    if (rid === undefined || rid === null) return false;
    var r = fieldWaiters[rid]; if (!r) return false;
    delete fieldWaiters[rid]; r(value); return true;
  }
  window.__field = {
    ready: function(){ return isReady ? Promise.resolve() : new Promise(function(r){ readyWaiters.push(r); }); },
    save:  function(){ return ask('export', null); },
    load:  function(data){ return ask('import', { data:String(data) }); },
    // #153 — the collective relay. pull() takes one emigrant out of this universe without putting it
    // on the wire; feed(packet) puts one in, through the sim's own network door.
    pull:  function(){ return ask('pull', null); },
    feed:  function(packet){ try { worker.postMessage({ type:'feed', packet:packet }); } catch(e){} },
    // The sim's own receive-side counters. Arrivals, not sends.
    stat:  function(){ return ask('stat', null); },
    // #158: test-only. Lets collective-test.js drive the evolved-silence case directly.
    setGeneForTest: function(gene,value){ return ask('setgene', { gene:String(gene), value:+value }); },
    // #154: show this universe's save/load buttons. The field calls this when it opens a cell.
    controls: function(show){ if (gioEl) gioEl.hidden = !show; }
  };

  worker.onmessage = function(e){
    var d = e.data || {};
    if (d.type === 'status'){ genEl.textContent = d.text; return; }
    if (d.type === 'ready'){
      isReady=true;
      // #153: clear the placeholder. In clean mode (#cleanart, which is every frame of a field) the
      // engine never writes the HUD, so nothing ever replaced "booting…" and nine frames sat there
      // claiming to be booting for as long as the page was open. It only ever meant "no status yet".
      if (genEl && genEl.textContent === 'booting…') genEl.textContent = '';
      while(readyWaiters.length) readyWaiters.shift()(); return;
    }
    if (d.type === 'persist'){
      try { if (d.value === null) localStorage.removeItem(d.key); else localStorage.setItem(d.key, d.value); } catch(ex){}
      return;
    }
    if (d.type === 'pulled'){ settle(d.rid, d.packet || null); return; }
    if (d.type === 'stat'){ settle(d.rid, d.stat || null); return; }
    if (d.type === 'setgene-result'){ settle(d.rid, !!d.ok); return; }
    if (d.type === 'export'){
      // A field-level save asks for the DATA, not a download. Only a click on this universe's own
      // save button (which carries no rid) should put a file on the device.
      if (settle(d.rid, d.file ? d.file.data : null)) return;
      if (!d.file){ fail('export failed (sim not ready?)'); return; }
      try {
        var blob = new Blob([d.file.data], {type:'application/json'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = d.file.filename; a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      } catch(ex){ fail('download failed: '+ex.message); }
      return;
    }
    if (d.type === 'import-result'){
      if (settle(d.rid, !!d.ok)) return;
      if (!d.ok) fail('import failed — file not a valid genome'); return; }
    if (d.type === 'error'){
      fail('Simulation error:\n' + (d.message||'') + (d.line?(' (line '+d.line+')'):'') + (d.stack?('\n\n'+d.stack):''));
      return;
    }
  };
  worker.onerror = function(e){ fail('Worker error: ' + (e.message||e.filename||'unknown') + (e.lineno?(' :'+e.lineno):'')); };

  // ── forward input to the worker ────────────────────────────────
  function post(ev, detail){ worker.postMessage({ type:'input', event:ev, detail:detail }); }
  function mouseDetail(e){ return { clientX:e.clientX, clientY:e.clientY, button:e.button, buttons:e.buttons }; }
  function touchDetail(e){
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || {clientX:0,clientY:0};
    var pack = function(list){ var a=[],i; if(!list) return a; for(i=0;i<list.length;i++) a.push({clientX:list[i].clientX, clientY:list[i].clientY}); return a; };
    return { clientX:t.clientX, clientY:t.clientY, touches:pack(e.touches), changedTouches:pack(e.changedTouches) };
  }
  window.addEventListener('mousemove', function(e){ post('mousemove', mouseDetail(e)); });
  window.addEventListener('mousedown', function(e){ post('mousedown', mouseDetail(e)); });
  window.addEventListener('mouseup',   function(e){ post('mouseup',   mouseDetail(e)); });
  window.addEventListener('keydown',   function(e){ post('keydown', { key:e.key, code:e.code, keyCode:e.keyCode }); });
  // Only swallow/forward touches that land on the canvas. Touches on the save/load
  // buttons must pass through untouched, or preventDefault cancels their tap.
  function onCanvas(e){ return e.target === canvas; }
  window.addEventListener('touchstart',function(e){ if(onCanvas(e)){ e.preventDefault(); post('touchstart', touchDetail(e)); } }, {passive:false});
  window.addEventListener('touchmove', function(e){ if(onCanvas(e)){ e.preventDefault(); post('touchmove',  touchDetail(e)); } }, {passive:false});
  window.addEventListener('touchend',  function(e){ if(onCanvas(e)){ post('touchend',  touchDetail(e)); } }, {passive:false});

  // ── resize: worker owns the drawing buffer now, so just tell it the new size ──
  var rT = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rT);
    rT = setTimeout(function(){ worker.postMessage({ type:'resize', w:bufW(), h:bufH() }); }, 150);
  });

  // ── save / load buttons (the sim's own DOM handlers don't run on this path) ──
  document.getElementById('gexp').onclick = function(){ worker.postMessage({ type:'export' }); };
  document.getElementById('gimp').onclick = function(){ document.getElementById('gfile').click(); };
  document.getElementById('gfile').onchange = function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(ev){ worker.postMessage({ type:'import', data: String(ev.target.result).trim() }); };
    r.readAsText(f);
  };

  // ── cross-tab METABOLISM panel ─────────────────────────────────
  // The sim's own metabolism observer builds its corner panel from the DOM, but the sim now
  // runs in the worker (no DOM there), so the panel can't render itself. That observer is
  // LISTEN-ONLY and driven entirely by a BroadcastChannel — which crosses the worker↔main
  // boundary — so we run a DISPLAY-ONLY copy of the sim's *exact* observer here on the main
  // thread. It hears the worker's own universe plus any other open tabs and draws the panel
  // with the sim's own markup/CSS (one source of truth, no fork). Persistence into
  // genome.coupling stays with the worker's copy; TAB_ID/genome/tick are passed as undefined
  // so this copy's typeof-guarded persistence no-ops and its "you" self-tag just resolves to
  // the peer id. Honors #nometab / #cleanart like the original.
  (function(){
    try {
      fetch('engine.html', { cache:'no-store' }).then(function(r){ return r.text(); }).then(function(html){
        // Bounded by an explicit end marker in engine.html. This used to be a GREEDY [\s\S]* with no
        // terminator, so the match ran to the LAST `})();` anywhere in the 1.6 MB file — correct only
        // because the observer happened to be the final statement in the script. Appending one IIFE
        // after it would have silently swallowed that code into this main-thread copy too, evaluated
        // with TAB_ID/genome/tick all undefined. Non-greedy to the marker, so ordering stops mattering.
        var m = html.match(/\(function metabolismObserver\(\)\{[\s\S]*?\}\)\(\);\/\/__METAB_END__/);
        if (!m) return;
        (new Function('TAB_ID','genome','tick', m[0]))(undefined, undefined, undefined);
      }).catch(function(){});
    } catch(e){}
  })();
})();
</script>
</body>
</html>
