<!doctype html>
<html><head><meta charset="utf-8"><title>Eye-Service</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
// The film page: a 3D world (scene.js), recorded days (day.js) and the script (director.js). capture.js calls
// window.EYE.frame(i) for each frame and saves what comes back.
import { World } from './scene.js';
import { Day } from './day.js';
import { Director } from './director.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920);
window.EYE = {
  async init(dataUrls) {
    const data = {};
    for (const [k, u] of Object.entries(dataUrls)) data[k] = await (await fetch(u)).json();
    const world = new World(W, H, 1);
    const hud = document.createElement('canvas'); hud.width = W; hud.height = H;
    document.body.appendChild(hud);
    this.dir = new Director(world, data, hud, Day);
    return { frames: this.dir.frames, fps: this.dir.fps };
  },
  frame(i, quality = 0.93) { this.dir.frame(i); return this.dir.hud.toDataURL('image/jpeg', quality); },
  still(spec, quality = 0.93) { this.dir.still(spec); return this.dir.hud.toDataURL('image/jpeg', quality); },
  events() { return this.dir.events(); },
};
window.ready = true;
</script></body></html>
