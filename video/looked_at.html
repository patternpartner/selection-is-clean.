<title>Looked At</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap">
<style>
/* One dark room. Pairs of light look at each other; being looked at is the only food. */
:root{
  --night:#07080c;
  --ink:#d9d4c4;
  --dim:#7d8088;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--font-mono);touch-action:none}
:root{padding:0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hint,.count{position:fixed;left:16px;right:16px;font-weight:300;font-size:12px;letter-spacing:.08em;pointer-events:none;color:var(--dim)}
.hint{top:calc(18px + env(safe-area-inset-top,0px));transition:opacity 2.5s;color:var(--ink)}
.hint.gone{opacity:0}
.count{bottom:calc(16px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;display:flex;gap:1.6em;flex-wrap:wrap}
.count b{font-weight:400;color:var(--ink)}
</style>
<canvas id="c"></canvas>
<div class="hint" id="hint">touch to look</div>
<div class="count"><span><b id="nNow">0</b> lit now</span><span><b id="nEver">0</b> ever lit</span><span><b id="nYou">0</b> lit from pairs you looked at</span></div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#07080c';ctx.fillRect(0,0,W,H)}
addEventListener('resize',resize);resize();

/* seeded so a reload is a different room only when asked: use time */
let seed=(Date.now()&0xffffffff)>>>0;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function gauss(){return (rnd()+rnd()+rnd()-1.5)*1.15}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* the glow sprites, one per hue bucket */
const HB=36,sprites=[];
for(let i=0;i<HB;i++){const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);const h=i*360/HB;
  gr.addColorStop(0,'hsla('+h+',30%,98%,1)');gr.addColorStop(.12,'hsla('+h+',70%,72%,.85)');gr.addColorStop(.4,'hsla('+h+',80%,50%,.22)');gr.addColorStop(1,'hsla('+h+',80%,40%,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);sprites.push(s)}

const CAP=110,SEE=240,G=0.0006,U=0.0006;
let pairs=[],nextId=1,ever=0,strangers=0,tick=0;
function newGenome(){return{near:rnd()*2-1,bright:rnd()*2-1,hueAff:rnd()*2-1,sepAff:rnd()*2-1,pull:rnd()*1.2-.3,hue:rnd()*360,sep:8+rnd()*22}}
function mutate(g){const m=.12;return{near:clamp(g.near+gauss()*m,-1,1),bright:clamp(g.bright+gauss()*m,-1,1),hueAff:clamp(g.hueAff+gauss()*m,-1,1),sepAff:clamp(g.sepAff+gauss()*m,-1,1),pull:clamp(g.pull+gauss()*m*.6,-.4,1),hue:(g.hue+gauss()*14+360)%360,sep:clamp(g.sep+gauss()*2.2,6,34)}}
const opts={neutral:false,visitor:false},rootTicks=new Map();
function make(g,x,y,e,stranger,root){ever++;if(stranger)strangers++;const id=nextId++;
  return{id,root:root||id,g,x,y,vx:0,vy:0,e,ang:rnd()*6.283,tgt:null,att:0,age:0,dying:0,flare:1,wob:rnd()*100,blink:rnd()*300}}
function addStranger(x,y){const p=make(newGenome(),x==null?60+rnd()*(W-120):x,y==null?60+rnd()*(H-120):y,.5,true);p.flare=1.6;pairs.push(p)}
function seedWorld(){pairs=[];ever=0;strangers=0;for(let i=0;i<70;i++){const p=make(newGenome(),60+rnd()*(W-120),60+rnd()*(H-120),.4+rnd()*.3,false);pairs.push(p)}}
seedWorld();

/* the pointer is one more pair, and it looks too */
const ptr={on:false,down:false,x:0,y:0,tgt:null,ang:0,seen:0};
function pos(e){ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true}
addEventListener('pointermove',pos);
addEventListener('pointerdown',e=>{pos(e);ptr.down=true;document.getElementById('hint').classList.add('gone')});
addEventListener('pointerup',()=>{ptr.down=false});
addEventListener('pointerleave',()=>{ptr.on=false;ptr.down=false});

function step(){
  tick++;
  const n=pairs.length;
  for(let i=0;i<n;i++){pairs[i].att=0}
  /* each pair chooses what to look at, by its own heritable taste */
  for(let i=0;i<n;i++){const p=pairs[i];if(p.dying)continue;
    let best=-1e9,bt=null;const g=p.g;
    for(let j=0;j<n;j++){if(j===i)continue;const q=pairs[j];if(q.dying)continue;
      const dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;if(d2>SEE*SEE)continue;
      const d=Math.sqrt(d2);let dh=Math.abs(q.g.hue-g.hue);if(dh>180)dh=360-dh;
      const s=g.near*(1-d/SEE)+g.bright*(q.e-.5)*2+g.hueAff*(1-dh/90)+g.sepAff*((q.g.sep-20)/14)+(((p.id*31+q.id*17)%7)-3)*.015;
      if(s>best){best=s;bt=q}}
    p.tgt=bt;if(bt)bt.att+=1}
  /* the visitor looks at the nearest one within reach, harder when pressing */
  ptr.tgt=null;if(ptr.on){let bd=170*170;for(const q of pairs){if(q.dying)continue;const dx=q.x-ptr.x,dy=q.y-ptr.y,d2=dx*dx+dy*dy;if(d2<bd){bd=d2;ptr.tgt=q}}
    if(ptr.tgt){ptr.tgt.att+=ptr.down?3.5:.8;if(ptr.down)rootTicks.set(ptr.tgt.root,(rootTicks.get(ptr.tgt.root)||0)+1)}}
  if(opts.visitor){let nw=null;for(const q of pairs){if(!q.dying&&q.root===q.id&&q.age<2400&&(!nw||q.age<nw.age))nw=q}
    if(nw){nw.att+=3.5;rootTicks.set(nw.root,(rootTicks.get(nw.root)||0)+1)}}
  if(opts.neutral){/* null: fixed random luck per creature, same total attention, unrelated to anything it does */let sum=0;for(const q of pairs){if(q.luck===undefined)q.luck=Math.exp(gauss()*1.1);if(!q.dying)sum+=q.luck}
    const live=pairs.filter(q=>!q.dying).length;for(const q of pairs)q.att=q.dying?0:live*q.luck/sum}
  const crowd=Math.max(1,n/CAP);
  const born=[];
  for(const p of pairs){
    p.age++;p.flare+=(1-p.flare)*.04;
    if(p.dying){p.dying++;continue}
    p.e+=(p.att*G-U*crowd)*1.0;
    /* motion: wander, lean toward what it looks at (or away, if shy), keep a little room */
    const t=p.tgt;let ax=Math.cos(tick*.011+p.wob)*.012,ay=Math.sin(tick*.0093+p.wob*1.3)*.012;
    if(t){const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;const want=Math.atan2(dy,dx);
      let da=want-p.ang;da=Math.atan2(Math.sin(da),Math.cos(da));p.ang+=da*.08;
      const k=p.g.pull*(d>70?.02:-.004);ax+=dx/d*k;ay+=dy/d*k}
    else p.ang+=.004;
    const m=60;if(p.x<m)ax+=.02;if(p.x>W-m)ax-=.02;if(p.y<m)ay+=.02;if(p.y>H-m)ay-=.02;
    p.vx=(p.vx+ax)*.965;p.vy=(p.vy+ay)*.965;p.x+=p.vx;p.y+=p.vy;
    if(p.e>=1&&pairs.length+born.length<CAP+20){p.e=.5;p.flare=1.8;const c=make(mutate(p.g),p.x+gauss()*8,p.y+gauss()*8,.5,false,p.root);c.flare=1.8;c.vx=gauss()*1.2;c.vy=gauss()*1.2;born.push(c)}
    if(p.e<=0){p.dying=1}
  }
  /* soft repulsion */
  for(let i=0;i<n;i++){const a=pairs[i];if(a.dying)continue;for(let j=i+1;j<n;j++){const b=pairs[j];if(b.dying)continue;const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1600&&d2>.01){const d=Math.sqrt(d2),f=(40-d)/40*.05;a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f}}}
  for(const c of born)pairs.push(c);
  pairs=pairs.filter(p=>p.dying<50);
  /* something new keeps arriving: a stranger now and then, and always if the room empties */
  if(pairs.length<40||(tick%330===0&&rnd()<.9))addStranger();
  if(ptr.on){ptr.ang=ptr.tgt?Math.atan2(ptr.tgt.y-ptr.y,ptr.tgt.x-ptr.x):ptr.ang}
}

function eyeAt(x,y,tx,ty,rr,hue,bright,lid,halo,pr){
  /* halo first (additive), then a real eye: sclera, dark pupil turned toward what it looks at, a lid */
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=halo;const sp=sprites[Math.round(hue/360*HB)%HB];ctx.drawImage(sp,x-rr*4,y-rr*4,rr*8,rr*8);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const a=Math.atan2(ty-y,tx-x),ry=Math.max(.12,lid)*rr;
  ctx.fillStyle='hsl('+hue+','+(30+bright*40)+'%,'+(62+bright*30)+'%)';
  ctx.beginPath();ctx.ellipse(x,y,rr,ry,0,0,6.2832);ctx.fill();
  ctx.fillStyle='#0b0a10';ctx.beginPath();ctx.ellipse(x+Math.cos(a)*rr*.34,y+Math.sin(a)*rr*.34*lid,rr*.5,Math.min(rr*.5,ry*.9),0,0,6.2832);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x+Math.cos(a)*rr*.34-rr*.16,y-ry*.25,rr*.13,0,6.2832);ctx.fill();
}
function pairAt(x,y,ang,sep,tx,ty,rr,hue,bright,lid,halo){
  const nx=-Math.sin(ang),ny=Math.cos(ang),h=sep*.5+rr*1.1;
  for(let k=-1;k<=1;k+=2)eyeAt(x+nx*h*k,y+ny*h*k,tx,ty,rr,hue,bright,lid,halo)
}
function draw(){
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.34;ctx.fillStyle='#07080c';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  /* threads of regard, so you can see who is looking at whom */
  ctx.globalCompositeOperation='lighter';ctx.lineWidth=1;
  for(const p of pairs){if(p.dying||!p.tgt)continue;const t=p.tgt;const a=clamp(.04+t.att*.025,0,.2)*clamp(p.e*1.5,0,1);
    ctx.globalAlpha=a;ctx.strokeStyle='hsl('+p.g.hue+',60%,70%)';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(t.x,t.y);ctx.stroke()}
  ctx.globalCompositeOperation='source-over';
  for(const p of pairs){
    const close=p.dying?clamp(p.dying/36,0,1):0,fade=p.dying?clamp(1-p.dying/50,0,1):1;
    const ph=(tick+p.blink)%280,bl=ph<9?1-Math.sin(ph/9*Math.PI):1;
    const lid=Math.min(bl,1-close*.95);
    const rr=(3.6+clamp(p.e,0,1.2)*2.6+Math.min(p.att,5)*.45)*p.flare;
    const t=p.tgt,tx=t?t.x:p.x+Math.cos(p.ang)*60,ty=t?t.y:p.y+Math.sin(p.ang)*60;
    ctx.globalAlpha=fade;
    pairAt(p.x,p.y,p.ang,p.g.sep*.45,tx,ty,rr,p.g.hue,clamp(p.att/3,0,1),lid,(.18+Math.min(p.att,5)*.06)*fade);
  }
  /* a newcomer announces itself once with a ring */
  for(const p of pairs){if(p.root===p.id&&p.age<70&&!p.dying&&p.id>70){ctx.globalAlpha=(1-p.age/70)*.6;ctx.strokeStyle='hsl('+p.g.hue+',70%,75%)';ctx.beginPath();ctx.arc(p.x,p.y,10+p.age*.9,0,6.2832);ctx.stroke()}}
  if(ptr.on){const tx=ptr.tgt?ptr.tgt.x:ptr.x+Math.cos(ptr.ang)*60,ty=ptr.tgt?ptr.tgt.y:ptr.y+Math.sin(ptr.ang)*60;
    if(ptr.tgt){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ptr.down?.55:.2;ctx.strokeStyle='#f3e9c8';ctx.lineWidth=ptr.down?1.6:1;ctx.beginPath();ctx.moveTo(ptr.x,ptr.y);ctx.lineTo(ptr.tgt.x,ptr.tgt.y);ctx.stroke();ctx.globalCompositeOperation='source-over'}
    ctx.globalAlpha=1;pairAt(ptr.x,ptr.y,ptr.ang,ptr.down?16:12,tx,ty,ptr.down?9:7,45,1,1,ptr.down?.5:.25)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
const eN=document.getElementById('nNow'),eE=document.getElementById('nEver'),eY=document.getElementById('nYou'),hint=document.getElementById('hint');
let last=0,acc=0,frame=0;
function loop(ts){
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;
  while(acc>=16.67){step();acc-=16.67}
  draw();
  if(++frame%15===0){eN.textContent=pairs.length;eE.textContent=ever.toLocaleString('en-GB');let y=0;for(const q of pairs)if(!q.dying&&(rootTicks.get(q.root)||0)>=120)y++;eY.textContent=y;
    /* say something only when a newcomer is alone */let lone=null;for(const q of pairs)if(!q.dying&&q.root===q.id&&q.id>70&&q.age<600&&q.att<.3&&(!lone||q.age<lone.age))lone=q;
    if(lone&&!ptr.down){hint.textContent='a stranger arrived. nobody is looking.';hint.classList.remove('gone')}else if(!lone&&frame>600)hint.classList.add('gone')}
  requestAnimationFrame(loop)
}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<200;i++)step()}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__lit={step,opts,rootTicks,get pairs(){return pairs},get ever(){return ever},get strangers(){return strangers},seed:s=>{seed=s>>>0;seedWorld()}};
})();
</script>
